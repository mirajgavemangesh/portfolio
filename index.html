<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mangesh Mirajgave – UX Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F5F6F8;--ink:#12161C;--mu:#586170;--ln:#D9DEE5;--ac:#0A66A8;--sf:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1319;--ink:#EDF0F4;--mu:#9AA4B2;--ln:#262D38;--ac:#5BB4F0;--sf:#171C24}}
:root[data-theme="dark"]{--bg:#0F1319;--ink:#EDF0F4;--mu:#9AA4B2;--ln:#262D38;--ac:#5BB4F0;--sf:#171C24}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--ac)}a:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:3px;border-radius:4px}
.w{max-width:1040px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--ln)}
header .w{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:18px;padding-bottom:18px;flex-wrap:wrap}
.logo{font-weight:800;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
nav a{color:var(--mu);text-decoration:none;margin-left:22px;font-weight:500}
nav a[aria-current],nav a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:6px;text-decoration-color:var(--ac);text-decoration-thickness:2px}
h1{font-size:clamp(2.3rem,6.4vw,4.4rem);line-height:1.04;letter-spacing:-.03em;font-weight:800;margin:72px 0 24px;max-width:15em}
h2{font-size:1.5rem;letter-spacing:-.01em;margin:0 0 12px;line-height:1.2}
h3{font-size:1.05rem;margin:18px 0 4px}
p{margin:0 0 14px;max-width:68ch}
.lead{font-size:1.2rem;color:var(--mu);max-width:56ch}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 8px}
.btn{display:inline-block;padding:12px 20px;border-radius:8px;border:1.5px solid var(--ink);color:var(--ink);text-decoration:none;font-weight:600}
.btn.p{background:var(--ink);color:var(--bg)}
.sec{padding:64px 0 8px}
.work a.row{display:grid;grid-template-columns:1fr 1.4fr;gap:8px 32px;padding:28px 0;border-top:1px solid var(--ln);text-decoration:none;color:var(--ink)}
.work a.row:last-child{border-bottom:1px solid var(--ln)}
.row b{font-size:1.6rem;letter-spacing:-.02em;line-height:1.15}
.row small,.meta dt{color:var(--mu);font-size:.9rem}
.row:hover b{color:var(--ac)}
.row span.d{color:var(--mu)}
.nda{padding:28px 0;border-top:1px solid var(--ln);color:var(--mu)}
.kw{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
figure{margin:0;background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px}
figure img{width:100%;height:auto;display:block;border-radius:6px}
figcaption{font-size:.93rem;color:var(--mu);padding:10px 4px 2px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px 24px;margin:8px 0 0;padding:20px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.meta dd{margin:0;font-weight:600}.meta dt{margin:0}
.cs section{display:grid;grid-template-columns:1fr 3fr;gap:12px 40px;padding:36px 0;border-bottom:1px solid var(--ln)}
.cs section>h2{font-size:1.1rem;color:var(--mu);font-weight:600}
ul{margin:0 0 14px;padding-left:20px;max-width:68ch}li{margin-bottom:6px}
blockquote{margin:0 0 16px;padding-left:16px;border-left:3px solid var(--ac);font-size:1.15rem;max-width:56ch}
.tb{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.95rem;min-width:560px}
th,td{text-align:left;vertical-align:top;padding:10px 12px 10px 0;border-bottom:1px solid var(--ln)}th{color:var(--mu);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px 32px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;list-style:none}.chips li{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:4px 14px;margin:0;font-size:.93rem}
.tl{list-style:none;padding:0}.tl li{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--ln);margin:0}.tl span{color:var(--mu)}
.ct{font-size:clamp(1.6rem,4vw,2.4rem);margin:40px 0 8px}.pg{border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:#fff;line-height:0}.pg img{width:100%;height:auto;display:block}.sl{position:relative}.hs{position:absolute;display:block;cursor:pointer;border-radius:4px}.hs:hover{outline:2px solid var(--ac)}.pn{display:flex;justify-content:space-between;gap:16px;padding:40px 0 8px;flex-wrap:wrap}
footer{margin-top:72px;border-top:1px solid var(--ln);padding:28px 0 40px;color:var(--mu);font-size:.95rem}
@media(max-width:720px){.work a.row,.cs section,.two{grid-template-columns:1fr}.tl li{grid-template-columns:1fr;gap:2px}h1{margin-top:48px}nav a{margin:0 16px 0 0}}
@media(prefers-reduced-motion:no-preference){main{animation:in .35s ease-out}@keyframes in{from{opacity:0}}}
</style></head><body>
<header><div class="w"><a class="logo" href="#/">Mangesh Mirajgave</a><nav aria-label="Main"><a href="#/" data-n="home">Work</a><a href="#/about" data-n="about">About</a></nav></div></header>
<main class="w" id="app"></main>
<footer><div class="w" id="ft"></div></footer>
<script>
var C={email:"",linkedin:"",resume:"",portfolio:""};
var IMG={a:"img/kind-22.jpg",b:"img/kind-23.jpg",c:"img/kind-24.jpg"};
var L=function(a){return"<ul>"+a.map(function(x){return"<li>"+x+"</li>"}).join("")+"</ul>"};
var T=function(h,r){return'<div class="tb"><table><thead><tr>'+h.map(function(x){return"<th>"+x+"</th>"}).join("")+"</tr></thead><tbody>"+r.map(function(x){return"<tr>"+x.map(function(y){return"<td>"+y+"</td>"}).join("")+"</tr>"}).join("")+"</tbody></table></div>"};
var CH=function(a){return'<ul class="chips">'+a.map(function(x){return"<li>"+x+"</li>"}).join("")+"</ul>"};
var CS={kiosk:{t:"Chili’s & It’s Just Wings self-service kiosk"},quest:{t:"Quest Intelligence: event reporting system"},vernova:{t:"GE Vernova Electrification Software website"}};
var ORD=["kiosk","quest","vernova"];
var WK={kiosk:["Hospitality · Kiosk MVP","Brinker International’s first self-service kiosk, ordering from two restaurant brands in one checkout."],quest:["Oil & Gas · Enterprise web app","A safety event reporting platform rebuilt for Angular, with global workflows intact."],vernova:["Energy · B2B website","1,500+ pages redesigned and moved to Drupal for GE Vernova’s rebrand."]};
function fig(k,c){return'<figure><img src="'+IMG[k]+'" alt="'+c+'" loading="lazy"><figcaption>'+c+"</figcaption></figure>"}
function home(){
return'<h1>I design software for grid operators, safety supervisors and hungry guests.</h1><p class="lead">Mangesh Mirajgave, UX designer with 7+ years across oil & gas, energy and hospitality. I turn complex business problems into interfaces people can use without a manual.</p><div class="btns"><a class="btn p" href="#/work/kiosk">See case studies</a>'+(C.resume?'<a class="btn" href="'+C.resume+'">Download resume</a>':"")+'<a class="btn" href="#/about">About me</a></div>'+
'<div class="sec"><h2>Selected work</h2><div class="work">'+ORD.map(function(k){return'<a class="row" href="#/work/'+k+'"><div><b>'+CS[k].t+"</b><br><small>"+WK[k][0]+'</small></div><span class="d">'+WK[k][1]+"</span></a>"}).join("")+'<div class="nda"><strong>GE Advanced Distribution Management System (2025–2026)</strong><br>Redesign of the OMS, Distribution Management and SCADA modules into one grid management platform. Under NDA; walkthrough available on request.</div></div></div>'+
'<div class="sec"><h2>What colleagues and clients say</h2><p class="lead">Recognition from Brinker, Capgemini and GE.</p><div class="kw">'+fig("b","Brandon Baker, Marketing Manager at Brinker International, thanking me for work on the It’s Just Wings and Chili’s app and website (Aug 2022).")+fig("a","Certificate of appreciation from Capgemini and Brinker leadership for outstanding contribution to Brinker Digital.")+fig("c","eCard from Ankit Singh (Sep 2025) for my work on the GE ADMS project, including my suggestion to streamline the user interface.")+"</div></div>"}
function about(){
var R=[["Sep 2021 – now","<strong>Capgemini</strong>, UX Associate Consultant<br>GE ADMS (2025–26), GE Vernova website (2024), SLB event reporting (2023–24), Brinker International (2021–23)"],["Mar 2020 – Sep 2021","<strong>Baxture Technology</strong>, UX UI Designer<br>Healthcare products and an HRMS portal"],["Apr 2019 – Mar 2020","<strong>Salt Technologies</strong>, UX UI Designer<br>WordPress business websites and social media creatives"]];
return'<h1>About</h1><p class="lead">I’m a UX designer with 7+ years of experience designing user-centric solutions in oil & gas, energy and hospitality. I use design thinking to work through complex business challenges, and I’m comfortable working alongside developers on Angular Material.</p>'+
'<div class="sec"><h2>Experience</h2><ul class="tl">'+R.map(function(r){return"<li><span>"+r[0]+"</span><div>"+r[1]+"</div></li>"}).join("")+'</ul></div>'+
'<div class="sec"><h2>How I work</h2>'+CH(["Design thinking","User research","Comparative analysis","Customer journey maps","User personas","Information architecture","User flows","Wireframing","Prototyping","Web accessibility","User testing","Data visualization","Design systems"])+'</div>'+
'<div class="sec two"><div><h2>Tools</h2>'+CH(["Figma","Adobe XD","Sketch","Photoshop","InVision","Illustrator"])+'</div><div><h2>Education & certifications</h2><p>B.E. Computer Engineering, 2013–2017<br><span class="d" style="color:var(--mu)">Smt. Kashibai Navale College of Engineering, Pune</span></p><p>Human Factors in AI, Duke University (Coursera), Oct 2025<br>Google UX Foundations, Coursera, Oct 2021</p></div></div>'+
'<div class="sec"><h2>Recognition</h2><div class="kw">'+fig("a","Capgemini and Brinker leadership certificate for outstanding contribution to Brinker Digital.")+fig("b","Thank-you note from Brinker’s marketing manager, Aug 2022.")+fig("c","GE ADMS eCard, Sep 2025.")+"</div></div>"}
var LK={"kiosk": [["https://www.figma.com/proto/tq2BkD7SARwvP91WJy7LsS/KIOSK-Case-Study--Copy-?page-id=1311%3A4299&node-id=1330-251&viewport=453%2C366%2C0.04&scaling=min-zoom&starting-point-node-id=1311%3A6138", 0, 69.861, 36.495, 21.382, 1.885], ["https://www.figma.com/proto/tq2BkD7SARwvP91WJy7LsS/KIOSK-Case-Study--Copy-?page-id=1311%3A4299&node-id=1330-251&viewport=453%2C366%2C0.04&scaling=min-zoom&starting-point-node-id=1311%3A6138", 5, 20.807, 7.784, 53.884, 3.295]], "quest": [], "vernova": [["https://www.gevernova.com/software/", 0, 13.194, 45.015, 20.45, 1.97]]};
function cs(k){var c=CS[k],i=ORD.indexOf(k),n=ORD[(i+1)%3],p=ORD[(i+2)%3],im="";for(var j=0;j<6;j++){var h="";(LK[k]||[]).forEach(function(l){if(l[1]===j)h+='<a class="hs" href="'+l[0].replace(/&/g,"&amp;")+'" target="_blank" rel="noopener" aria-label="Open link" style="left:'+l[2]+'%;top:'+l[3]+'%;width:'+l[4]+'%;height:'+l[5]+'%"></a>'});
im+='<div class="sl"><img src="img/'+k+'-'+(j+1)+'.jpg" alt="'+(j==0?c.t+' case study':'')+'" '+(j>0?'loading="lazy" ':'')+'>'+h+"</div>"}
return'<div class="cs"><h1 class="ct">'+c.t+'</h1><div class="pg">'+im+'</div><div class="pn"><a href="#/work/'+p+'">Previous: '+CS[p].t+'</a><a href="#/work/'+n+'">Next: '+CS[n].t+"</a></div></div>"}
function ft(){var a=[];if(C.email)a.push('<a href="mailto:'+C.email+'">'+C.email+"</a>");if(C.linkedin)a.push('<a href="'+C.linkedin+'" target="_blank" rel="noopener">LinkedIn</a>');if(C.resume)a.push('<a href="'+C.resume+'">Resume (PDF)</a>');return"<p>Open to UX design roles. "+(a.length?a.join(" &nbsp;·&nbsp; "):"Contact details are on my resume.")+"</p><p>© 2026 Mangesh Mirajgave</p>"}
function go(){var h=(location.hash||"#/").slice(2),m=h.match(/^work\/(\w+)$/),v,t="Mangesh Mirajgave – UX Designer",n="home";
if(m&&CS[m[1]]){v=cs(m[1]);t=CS[m[1]].t+" – Mangesh Mirajgave";n="home"}else if(h==="about"){v=about();t="About – Mangesh Mirajgave";n="about"}else v=home();
document.getElementById("app").innerHTML=v;document.title=t;document.getElementById("ft").innerHTML=ft();
[].forEach.call(document.querySelectorAll("nav a"),function(a){a.getAttribute("data-n")===n&&!m?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});window.scrollTo(0,0)}
window.addEventListener("hashchange",go);go();
</script></body></html>
